<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RotaTV asset bridge</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1020;color:#ecedf6;padding:24px}</style>
</head>
<body>
<p id="status">Preparing files…</p>
<script>
// Hands the App Store images in this folder to the App Store Connect window that opened this page.
(async () => {
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.hash.slice(1));
  const names = (params.get('files') || '').split(',').map(s => s.trim()).filter(n => /^[\w.-]+\.(png|jpe?g)$/i.test(n));
  if (!window.opener) { status.textContent = 'Open this page from App Store Connect.'; return; }
  const files = [];
  for (const name of names) {
    const response = await fetch(name, { cache: 'no-store' });
    if (!response.ok) { status.textContent = 'Missing ' + name; return; }
    files.push({ name, type: response.headers.get('content-type') || 'image/png', blob: await response.blob() });
  }
  window.opener.postMessage({ rotatvAssets: files, request: params.get('id') }, 'https://appstoreconnect.apple.com');
  status.textContent = 'Sent ' + files.length + ' file(s). This tab can be closed.';
})();
</script>
</body>
</html>
